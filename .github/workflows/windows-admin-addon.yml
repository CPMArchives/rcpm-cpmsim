name: Check optional Windows administration add-on
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'build_windows_admin.py'
      - 'check_windows_admin.py'
      - 'docs/ADMINISTRATION-WINDOWS.md'
      - '.github/workflows/windows-admin-addon.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the published Windows base package
        shell: pwsh
        run: |
          gh release download v1.2.2 --repo "$env:GITHUB_REPOSITORY" --pattern rcpm-v1.2.2-windows-x64.zip --pattern SHA256SUMS --dir input
          python -B -c "from pathlib import Path;from check_windows_release import sha; r={l.split()[1]:l.split()[0] for l in Path('input/SHA256SUMS').read_text().splitlines()};assert sha(Path('input/rcpm-v1.2.2-windows-x64.zip'))==r['rcpm-v1.2.2-windows-x64.zip']"
      - name: Build the add-on and unpack a separate base
        run: |
          python -B build_windows_admin.py --package input/rcpm-v1.2.2-windows-x64.zip --output out
          python -B -c "from pathlib import Path;from check_windows_release import unpack;unpack(Path('input/rcpm-v1.2.2-windows-x64.zip'),Path('base'))"
      - name: Check private worker, callers, console, scheduled backup and monitoring
        run: python -B check_windows_admin.py --base base/RCPM-windows-x64 --addon out/RCPM-admin-windows-x64 --output evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admin-windows-v0.1.0
          path: |
            out/*.zip
            out/SHA256SUMS
            evidence/*
  windows-arm64:
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: admin-windows-v0.1.0
          path: checked
      - name: Verify the same add-on and published base
        shell: pwsh
        run: |
          gh release download v1.2.2 --repo "$env:GITHUB_REPOSITORY" --pattern rcpm-v1.2.2-windows-x64.zip --pattern SHA256SUMS --dir input
          python -B -c "from pathlib import Path;from check_windows_release import sha,unpack; r={l.split()[1]:l.split()[0] for l in Path('input/SHA256SUMS').read_text().splitlines()};assert sha(Path('input/rcpm-v1.2.2-windows-x64.zip'))==r['rcpm-v1.2.2-windows-x64.zip'];unpack(Path('input/rcpm-v1.2.2-windows-x64.zip'),Path('base'))"
          python -B -c "from pathlib import Path;import hashlib,zipfile;p=next(Path('checked').rglob('rcpm-admin-v0.1.0-windows-x64.zip'));s=next(Path('checked').rglob('SHA256SUMS')).read_text().split()[0];assert hashlib.sha256(p.read_bytes()).hexdigest()==s;zipfile.ZipFile(p).extractall('addon')"
      - name: Check the x64 base under Windows 11 ARM64 emulation
        run: python -B check_windows_admin.py --base base/RCPM-windows-x64 --addon addon/RCPM-admin-windows-x64 --output evidence-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admin-windows-arm64-evidence
          path: evidence-arm64/*

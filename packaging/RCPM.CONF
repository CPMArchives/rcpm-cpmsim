# RCP/M host connection settings. Defaults work without editing this file.
# Stop RCP/M before changing settings; restart with the normal launcher.
# MODE=direct: raw TCP; MODE=ip232: launcher runs the bundled virtual modem.
MODE=direct
# 127.0.0.1 permits callers on this computer only. For network callers, set
# your host's IPv4 address or 0.0.0.0 (all interfaces) and permit PORT locally.
ADDRESS=127.0.0.1
# Caller port in BOTH modes. Change only for a conflict or another board.
# The virtual modem's internal loopback connection is selected automatically.
PORT=4000
